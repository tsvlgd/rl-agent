spec_version: 1
name: rl_code_review_agent
type: space
runtime: fastapi
app: server.app:app
port: 8000
description: "A 3-stage curriculum for PEP8, security, and complexity code review."

tasks:
  - id: "easy"
    name: "PEP8 Fixer"
    difficulty: "easy"
    grader: "graders.evaluate_agent_submission"

  - id: "medium"
    name: "Security Auditor"
    difficulty: "medium"
    grader: "graders.evaluate_agent_submission"

  - id: "hard"
    name: "Logic Refactor"
    difficulty: "hard"
    grader: "graders.evaluate_agent_submission"
